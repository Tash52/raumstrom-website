frage: Muss ich meine Wallbox beim Netzbetreiber anmelden?
antwort: Ja. Nach § 19 Abs. 2 NAV sind Ladeeinrichtungen für Elektrofahrzeuge dem Netzbetreiber vor Inbetriebnahme mitzuteilen. Ab einer Summen-Bemessungsleistung über 12 kVA je elektrischer Anlage ist zusätzlich seine vorherige Zustimmung nötig. Wir unterstützen Sie bei der Anmeldung.
