frage: Sollte ich die Elektrik vor dem Einzug prüfen lassen?
antwort: Ja. Veränderungen sind vor Boden und Anstrich deutlich einfacher als danach. Wir stellen fest, ob Handlungsbedarf besteht; die Ausführung übernimmt unser Meister-Partnerbetrieb.
leistungen:
  - wohnung-bezugsfertig
