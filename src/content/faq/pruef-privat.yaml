frage: Gilt DGUV V3 auch für meine private Wallbox?
antwort: Die DGUV Vorschrift 3 gilt für Unternehmer mit Beschäftigten. Für Privatpersonen besteht sie nicht unmittelbar. Eine regelmäßige Überprüfung kann dennoch sinnvoll sein. Wir beraten dazu.
