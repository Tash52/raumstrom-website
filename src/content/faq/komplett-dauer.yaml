frage: Wie lange dauert eine Komplettrenovierung?
antwort: Die Dauer hängt von Größe, Zustand und Umfang ab. Eine verlässliche Angabe ist erst nach der Besichtigung möglich. Wir nennen Ihnen im Angebot einen Zeitplan mit der Reihenfolge der Gewerke.
