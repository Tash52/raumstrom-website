frage: Was bedeutet „ein Ansprechpartner für die gesamte Renovierung“?
antwort: Sie sprechen mit uns, nicht mit jedem Gewerk einzeln. Wir erstellen den Ablauf, stimmen Termine zwischen den Gewerken ab, halten Sie auf dem Laufenden und sind Ihr Ansprechpartner bei Rückfragen. Die Ausführung liegt je nach Gewerk bei uns oder bei einem Meister-Partnerbetrieb.
