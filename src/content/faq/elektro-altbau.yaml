frage: Muss die Elektrik im Altbau komplett erneuert werden?
antwort: Nicht pauschal. Ob Leitungen, Verteilung oder Zählerschrank erneuert werden sollten, hängt vom Zustand und von Ihrem Nutzungsplan ab. Das beurteilt unser Meister-Partnerbetrieb vor Ort.
leistungen:
  - elektro-modernisierung
reihenfolge: 16
