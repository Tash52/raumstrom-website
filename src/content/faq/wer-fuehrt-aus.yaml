frage: Wer führt die Arbeiten tatsächlich aus?
antwort: Das hängt vom Gewerk. Demontage und Entkernung, Trockenbau, Bodenbeläge und den Prüfservice DGUV V3 führen wir selbst aus. Elektroinstallation, Wallbox, Zählerschrank, Fliesen, Putz und Malerarbeiten übernehmen unsere festen Meister-Partnerbetriebe. Wir planen und koordinieren alle Gewerke. Bei jeder Leistung steht sichtbar, wer ausführt.
