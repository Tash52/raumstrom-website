frage: Muss ich meine Ladepunkte prüfen lassen?
antwort: Als Unternehmer sind Sie für den sicheren Zustand Ihrer elektrischen Anlagen und Betriebsmittel verantwortlich und müssen diese nach DGUV Vorschrift 3 wiederkehrend prüfen lassen. Wir bieten dafür den Prüfservice an.
leistungen:
  - ladepunkte-unternehmen
