frage: Wie läuft eine Anfrage ab?
antwort: Sie schildern Ihr Vorhaben über das Kontaktformular, gern mit Fotos oder einer Skizze aus dem Raumplaner. Danach vereinbaren wir eine Besichtigung, nehmen Maß und erstellen ein Angebot, in dem Leistungen und Ausführende benannt sind.
