frage: Wie oft müssen Ladepunkte nach DGUV V3 geprüft werden?
antwort: "Die Fristen legt der Unternehmer anhand einer Gefährdungsbeurteilung fest. Als Richtwert gelten für ortsfeste Anlagen vier Jahre, für ortsveränderliche Betriebsmittel wie Ladekabel kürzere Intervalle. Wir beraten Sie zu Ihrem Fall. [[PLATZHALTER: Fristen gegen DGUV-Primärquelle prüfen]]"
