version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Exact versions stay exact (save-exact in .npmrc).
    versioning-strategy: increase
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
      keystatic:
        patterns: ['@keystatic/*']
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      test-tools:
        patterns: ['vitest', '@playwright/test', 'typescript', '@types/node']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
