name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      # Actions pinned to commit SHAs (tag in comment); Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.5'
          cache: npm
      - name: Install (lockfile, no install scripts)
        run: npm ci --ignore-scripts
      - name: Wording scan
        run: npm run scan:wording
      - name: Licenses
        run: npm run licenses -- --check
      - name: Trend schema up to date
        run: npm run trend-schema -- --check
      - name: Type check
        run: npm run check
      - name: Unit tests and hook tests
        run: npm test
      - name: npm audit (no High/Critical except documented, expiring exceptions)
        run: npm run audit
      - name: Production build must refuse while items are open
        run: |
          if npm run build; then
            echo "::error::npm run build ran although the launch check has open items"
            exit 1
          fi
      - name: Staging build
        run: npm run build:staging
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: E2E against the production server
        run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
